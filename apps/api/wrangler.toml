name = "openwf-mod-manager-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# --- D1 (metadata) ---
[[d1_databases]]
binding = "DB"
database_name = "openwf-mod-manager"
database_id = "a330ba8c-47f6-4872-b906-bd67d833e552"

# --- GitHub Releases (mod zip storage) ---
# Mods here are small (metadata patches / .pluto scripts, sub-1MB), so
# GitHub Releases is a better fit than object storage: zero cost, zero
# billing surface, no payment method required anywhere in the stack.
# Deliberately a separate repo from the app itself (not
# EmberCatz/OpenWF-Mod-Manager) — otherwise every mod upload and every
# future app release (installers, version tags) would end up mixed
# together in the same repo's Releases list. This repo holds nothing but
# mod Release assets; must stay public (release assets need to be
# downloadable without auth).
[vars]
GITHUB_OWNER = "EmberCatz"
GITHUB_REPO = "OpenWF-Mods"

# Secrets (do NOT put these in this file — set them with:
#   wrangler secret put UPLOAD_API_KEY_SALT
#   wrangler secret put GITHUB_TOKEN
# and for local dev, put them in apps/api/.dev.vars (gitignored), see
# .dev.vars.example).
