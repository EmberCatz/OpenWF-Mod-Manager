name = "openwf-mod-manager-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# --- D1 (metadata) ---
[[d1_databases]]
binding = "DB"
database_name = "openwf-mod-manager"
database_id = "a330ba8c-47f6-4872-b906-bd67d833e552"

# --- Edge rate limiting (login/signup burst guard) ---
# Workers' native Rate Limiting binding — enforced at Cloudflare's network
# edge, ahead of the D1-backed per-route limiter in rateLimit.ts. Doesn't
# replace that limiter (its period is capped at 60s, too short to express
# "8 per 5 minutes" or "5 per hour" directly) — it's a coarse first line of
# defense so a genuine request flood gets rejected before ever touching D1,
# rather than a tighter effective per-IP quota. namespace_id is just an
# arbitrary label Cloudflare uses to key this binding's own counters; it
# doesn't refer to any resource you create elsewhere.
[[ratelimits]]
name = "EDGE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# --- GitHub Releases (mod zip storage) ---
# Mods here are small (metadata patches / .pluto scripts, sub-1MB), so
# GitHub Releases is a better fit than object storage: zero cost, zero
# billing surface, no payment method required anywhere in the stack.
# Deliberately a separate repo from the app itself (not
# EmberCatz/OpenWF-Mod-Manager) — otherwise every mod upload and every
# future app release (installers, version tags) would end up mixed
# together in the same repo's Releases list. This repo holds nothing but
# mod Release assets; must stay public (release assets need to be
# downloadable without auth).
[vars]
GITHUB_OWNER = "EmberCatz"
GITHUB_REPO = "OpenWF-Mods"

# Secrets (do NOT put these in this file — set them with:
#   wrangler secret put UPLOAD_API_KEY_SALT
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put VIRUSTOTAL_API_KEY
#   wrangler secret put SCAN_TRIGGER_SECRET
# and for local dev, put them in apps/api/.dev.vars (gitignored), see
# .dev.vars.example).

# --- Malware scan cron (src/scan.ts) ---
# Fires the scheduled handler once a minute — the finest granularity Cron
# Triggers support, which lines up with VirusTotal's free-tier 4-requests/
# minute cap. A no-op (see scan.ts's early return) until
# VIRUSTOTAL_API_KEY is actually set.
[triggers]
crons = ["* * * * *"]

# --- Observability ---
# Turned on while debugging why the cron above wasn't firing in production
# (wrangler tail only shows *live* traffic while it's running, so it can't
# prove a cron never invoked over a period you weren't actively watching —
# persisted invocation logs can). Codified here, not just toggled in the
# dashboard, so a future `wrangler deploy` from this file doesn't silently
# revert it.
[observability]
enabled = true

  [observability.logs]
  enabled = true
  invocation_logs = true
