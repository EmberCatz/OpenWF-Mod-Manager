<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWF Mod Manager</title>
    <!-- Rajdhani: a free/open condensed technical font used for the
         Warframe-inspired HUD look (headings, buttons) — not the game's
         own font, just similar in spirit. League Gothic: a taller,
         heavily condensed display font used just for the app title
         (.app > h1 in styles.css). Roboto: used for the tab bar
         specifically (.tab in styles.css), for a plainer look than the
         condensed HUD font elsewhere. All fall back to system fonts if
         offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Rajdhani:wght@500;600;700&family=Roboto:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
